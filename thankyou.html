<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f7f2ea">
<title>예약 정보 접수 완료 | 고유재 한옥스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#f7f2ea;--ink:#241c16;--gold:#9b7134;--line:#d9cdbb;--muted:#8e7b69}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink)}body{font-family:'Noto Sans KR',sans-serif;font-weight:300;min-height:100vh}
.wrap{width:min(680px,calc(100% - 40px));margin:0 auto;padding:72px 0 96px;text-align:center}.mark{font-family:'Noto Serif KR',serif;color:var(--gold);font-size:34px;line-height:1;margin-bottom:38px}.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}.title{font-family:'Noto Serif KR',serif;font-size:34px;font-weight:300;line-height:1.45;margin:20px 0}.desc{font-size:14px;line-height:2;color:var(--muted)}.notice{margin-top:38px;border:1px solid var(--line);padding:26px 24px;text-align:left;font-size:13px;line-height:2;color:#6f5d4c}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}.btn{display:flex;min-height:52px;align-items:center;justify-content:center;border:1px solid var(--gold);color:var(--gold);text-decoration:none;font-size:13px}.btn.primary{background:var(--gold);color:#fff}
@media(max-width:540px){.wrap{width:min(100% - 32px,680px);padding:54px 0 72px}.title{font-size:28px}.actions{grid-template-columns:1fr}}
</style>
<script src="/assets/js/runtime-config.js" defer></script>
<script src="/assets/js/tracking.js" defer></script>
</head>
<body>
<main class="wrap">
  <div class="mark" aria-hidden="true">✦</div>
  <p class="eyebrow">Reservation Received</p>
  <h1 class="title">예약 정보 접수가<br>완료되었습니다</h1>
  <p class="desc">입력하신 예약 정보를 확인한 뒤<br>48시간 이내에 예약 확인 연락을 드리겠습니다.</p>
  <div class="notice"><strong>입금자명과 예약 정보를 확인한 뒤</strong> 예약 현황이 업데이트됩니다. 수정이 필요한 내용이 있거나 일정 확인이 급하신 경우 카카오톡 채널로 아기 이름과 촬영 예정일을 함께 남겨주세요.</div>
  <div class="actions">
    <a class="btn primary" href="https://pf.kakao.com/_xiRxjhxj" target="_blank" rel="noopener">카카오톡 채널 문의</a>
    <a class="btn" href="/status">예약 현황 확인</a>
  </div>
</main>
</body>
</html>
